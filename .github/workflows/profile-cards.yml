# Builds the images the profile README embeds (stats, top languages, contribution snake)
# and pushes them to the `output` branch. The README loads them from raw.githubusercontent.com,
# so nothing depends on third-party card servers being up.
name: profile-cards

on:
  schedule:
    - cron: "17 3 * * *" # once a day, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-cards.yml]

permissions:
  contents: read

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed only to push the generated SVGs to the `output` branch
    env:
      THEME: bg_color=0d1117&title_color=3dff9a&icon_color=3dff9a&text_color=c9d1d9&border_color=30363d&border_radius=6
    steps:
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&custom_title=$ stats --user ${{ github.repository_owner }}&${{ env.THEME }}
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&custom_title=$ top --langs&${{ env.THEME }}
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3dff9a&color_dots=#161b22,#0e4429,#006d32,#26a641,#3dff9a
            dist/snake-light.svg?palette=github-light&color_snake=#1a7f37

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
